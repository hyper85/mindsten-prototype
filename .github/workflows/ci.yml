name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Also run as the first job of the Supabase deploy, so a broken migration can't deploy.
  workflow_call:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npx vite build

  functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check --config supabase/functions/deno.json supabase/functions/*/index.ts

  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17 # match [db] major_version in supabase/config.toml
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Apply migrations twice (idempotency) and seed
        run: |
          psql -v ON_ERROR_STOP=1 -q -f supabase/tests/roles.sql
          for f in supabase/migrations/*.sql; do psql -v ON_ERROR_STOP=1 -q -f "$f"; done
          for f in supabase/migrations/*.sql; do psql -v ON_ERROR_STOP=1 -q -f "$f"; done
          psql -v ON_ERROR_STOP=1 -q -f supabase/seed.sql
          psql -v ON_ERROR_STOP=1 -q -f supabase/seed.sql
      - name: SQL function checks
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/tests/functions.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/hardening.sql
