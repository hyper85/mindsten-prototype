name: Deploy Supabase

# Pushes database migrations + seed and deploys Edge Functions.
# Required repository secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN   personal access token (supabase.com/dashboard/account/tokens)
#   SUPABASE_PROJECT_REF    the project ref, e.g. abcdefghijklmnopqrst
#   SUPABASE_DB_PASSWORD    database password chosen when the project was created
#   One model key for scan-gravestone and era-story:
#     ANTHROPIC_API_KEY     Claude API directly (console.anthropic.com), or
#     OPENCODE_API_KEY      OpenCode Zen gateway (opencode.ai) — Claude models via /v1/messages
#   LLM_MODEL (optional)    model id for the chosen provider
#   LLM_VISION_MODEL (optional)  model for reading gravestone photos (default: LLM_MODEL)
#   ALLOWED_ORIGINS (optional)  comma-separated browser origins allowed to call the functions,
#                               e.g. https://mindsten.dk,https://*.vercel.app (unset = any)
#   ASK_SIGNING_KEY (optional)  HMAC key for ask-person answer signatures (default: service role key)

on:
  push:
    branches: [main]
    paths: ['supabase/**', '.github/workflows/supabase-deploy.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-deploy
  cancel-in-progress: false

jobs:
  # Lint, tests, Deno check and migrations + SQL tests on a scratch Postgres first.
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - name: Check secrets
        run: |
          missing=""
          for v in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD PROJECT_REF; do
            [ -z "${!v}" ] && missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing secrets:$missing — see .claude/skills/deploy/SKILL.md"
            exit 1
          fi
      - uses: supabase/setup-cli@v1
        with:
          version: 2.118.0
      - run: supabase link --project-ref "$PROJECT_REF"
      - name: Push migrations and seed
        run: supabase db push --include-seed
      - name: Set function secrets
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          LLM_VISION_MODEL: ${{ secrets.LLM_VISION_MODEL }}
          ALLOWED_ORIGINS: ${{ secrets.ALLOWED_ORIGINS }}
          ASK_SIGNING_KEY: ${{ secrets.ASK_SIGNING_KEY }}
        run: |
          args=()
          for v in ANTHROPIC_API_KEY OPENCODE_API_KEY LLM_MODEL LLM_VISION_MODEL ALLOWED_ORIGINS ASK_SIGNING_KEY; do
            if [ -n "${!v}" ]; then args+=("$v=${!v}"); fi
          done
          if [ -z "$ANTHROPIC_API_KEY$OPENCODE_API_KEY" ]; then
            echo "::warning::Neither ANTHROPIC_API_KEY nor OPENCODE_API_KEY is set — scanning and AI stories will return errors."
          fi
          if [ "${#args[@]}" -gt 0 ]; then
            supabase secrets set --project-ref "$PROJECT_REF" "${args[@]}"
          fi
      - name: Deploy Edge Functions
        run: supabase functions deploy --project-ref "$PROJECT_REF" --use-api
