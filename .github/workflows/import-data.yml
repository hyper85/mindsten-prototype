name: Import persons from Wikidata

# Fills the database with people buried in Denmark (Wikidata + Danish Wikipedia).
# Runs monthly and on demand. Required secrets:
#   SUPABASE_URL               https://<project-ref>.supabase.co
#   SUPABASE_SERVICE_ROLE_KEY  Project Settings → API → service_role (never expose to the browser)

on:
  schedule:
    - cron: '17 3 1 * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Max persons (blank = all)'
        required: false
      dry_run:
        description: 'Dry run (write nothing)'
        type: boolean
        default: false

permissions:
  contents: read

# One import at a time; a second run waits instead of writing concurrently.
concurrency:
  group: import-data
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Import
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          LIMIT: ${{ inputs.limit }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          args=()
          if [ -n "$LIMIT" ]; then
            if ! [[ "$LIMIT" =~ ^[1-9][0-9]*$ ]]; then
              echo "::error::limit must be a positive whole number"
              exit 1
            fi
            args+=(--limit "$LIMIT")
          fi
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          npm run import:wikidata -- "${args[@]}"
